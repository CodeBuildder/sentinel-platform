[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-sdk"
version = "0.1.0"
description = "Shared bus SDK and schema validator for the Sentinel platform"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0.0",
    "jsonschema>=4.22.0",
    "pydantic>=2.9.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis>=2.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
